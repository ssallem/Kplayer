<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPLAYER TV</title><style>
*{box-sizing:border-box}body{margin:0;background:#17221b;color:#edf7e7;font-family:system-ui,sans-serif}video{position:fixed;inset:0;width:100%;height:100%;background:#111;object-fit:contain}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px;background:#17221bf5;text-align:center}h1{font-size:clamp(32px,5vw,64px);margin:10px}p{color:#b4c7a8;line-height:1.8;font-size:20px}form{display:flex;gap:16px}input,button{font:inherit;font-size:24px;padding:18px;border-radius:10px;border:1px solid #a3bc89}input{width:220px;text-align:center;letter-spacing:8px}button{background:#d7f88b;color:#273b1d;cursor:pointer}.note{font-size:15px;color:#b4c7a8;max-width:600px}.hidden{display:none!important}#notice{position:fixed;left:5%;right:5%;bottom:6%;text-align:center;z-index:3}#notice button{box-shadow:0 8px 35px #0009}#error{color:#ffc2a8;min-height:30px}
</style></head><body><video id="video" controls playsinline crossorigin="anonymous"></video><section id="pair" class="panel"><span>OFFLINE · LOCAL NETWORK ONLY</span><h1>KPLAYER TV</h1><p>PC 화면에 표시된 연결 번호를 입력하세요.</p><form id="form"><input id="pin" inputmode="numeric" autocomplete="off" aria-label="6자리 연결 번호" maxlength="6" pattern="[0-9]{6}" required autofocus><button>연결</button></form><p id="error" role="alert"></p><p class="note">인터넷 없이 같은 공유기 안에서 재생합니다.<br>PC가 세션을 비우거나 종료하면 연결도 종료됩니다.</p></section><section id="waiting" class="panel hidden"><h1>연결되었습니다.</h1><p>PC에서 영상을 선택하고 TV로 보내 주세요.</p></section><div id="notice" class="hidden"><button id="start">TV에서 재생 시작</button></div><script>
const video=document.getElementById('video'),pair=document.getElementById('pair'),waiting=document.getElementById('waiting'),notice=document.getElementById('notice');let token,events,subtitles=true;
async function report(ackId,error){if(!token)return;try{await fetch('/tv/status/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ackId,error:!!error,currentTime:video.currentTime||0,duration:Number.isFinite(video.duration)?video.duration:0,volume:video.volume,playerState:video.ended?'IDLE':video.paused?'PAUSED':video.readyState<3?'BUFFERING':'PLAYING',subtitlesEnabled:subtitles})});}catch{}}
function applyTracks(){for(const track of video.textTracks)track.mode=subtitles?'showing':'hidden';}
video.textTracks.addEventListener('addtrack',applyTracks);
async function play(){try{await video.play();notice.classList.add('hidden');}catch(e){notice.classList.remove('hidden');throw e;}}
document.getElementById('start').onclick=()=>play().catch(()=>{});
document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const response=await fetch('/tv/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('pin').value})});const data=await response.json();if(!response.ok)throw new Error(data.error);token=data.token;pair.classList.add('hidden');waiting.classList.remove('hidden');events?.close();events=new EventSource('/tv/events/'+token);events.onmessage=async e=>{const command=JSON.parse(e.data);try{if(command.action==='load'){video.pause();video.replaceChildren();const media=command.media;video.src=media.contentId;subtitles=command.subtitles;for(const t of media.tracks||[]){const track=document.createElement('track');track.kind='subtitles';track.src=t.trackContentId;track.srclang=t.language||'ko';track.label='자막';track.default=true;video.appendChild(track);}waiting.classList.add('hidden');await new Promise((resolve,reject)=>{let timer=setTimeout(()=>done(new Error('timeout')),6500);const ok=()=>done(),bad=()=>done(new Error('media'));function done(err){clearTimeout(timer);video.removeEventListener('loadedmetadata',ok);video.removeEventListener('error',bad);err?reject(err):resolve();}video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('error',bad,{once:true});video.load();});video.currentTime=command.currentTime||0;applyTracks();if(command.autoplay)await play();}else if(command.action==='play')await play();else if(command.action==='pause')video.pause();else if(command.action==='seek')video.currentTime=command.value;else if(command.action==='volume')video.volume=command.value;else if(command.action==='subtitles'){subtitles=command.value;applyTracks();}else if(command.action==='stop'){video.pause();video.removeAttribute('src');video.load();waiting.classList.remove('hidden');}await report(command.id);}catch(err){await report(command.id,true);}};events.onerror=async()=>{try{const r=await fetch('/tv/check/'+token);if(!r.ok){events.close();token=null;video.pause();video.removeAttribute('src');video.load();waiting.classList.add('hidden');pair.classList.remove('hidden');document.getElementById('error').textContent='세션이 종료되었습니다. 새 연결 번호를 입력하세요.';}}catch{video.pause();}};}catch(err){document.getElementById('error').textContent=err.message;}};
setInterval(()=>report(),2000);
</script></body></html>
